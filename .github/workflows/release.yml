name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install sshd, rsync, tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client rsync tmux
      - name: Tests
        run: |
          go test -race ./...
          make test-integration
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RECOM_SIGNING_KEY: ${{ secrets.RECOM_SIGNING_KEY }}
        run: |
          go run ./internal/tools/signrelease dist/checksums.txt
          gh release upload "$TAG" dist/checksums.txt.sig --repo "$GITHUB_REPOSITORY"
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum --check checksums.txt
          (cd .. && go run ./internal/tools/signrelease -verify verify/checksums.txt)
          RECOM_VERSION="$TAG" RECOM_INSTALL_DIR="$PWD/bin" sh ../install.sh
          tar -xzf recom_${TAG#v}_linux_amd64.tar.gz
          ./recom version | tee /dev/stderr | grep -q "recom ${TAG#v}"
          ./recom version | grep -q "linux/amd64, linux/arm64"

