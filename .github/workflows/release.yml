name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install sshd, rsync, tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client rsync tmux
      - name: Tests
        run: |
          go test -race ./...
          make test-integration
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum --check checksums.txt
          tar -xzf recom_${TAG#v}_linux_amd64.tar.gz
          ./recom version | tee /dev/stderr | grep -q "recom ${TAG#v}"
          ./recom version | grep -q "linux/amd64, linux/arm64"

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render and push the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; update chaseungjoon/homebrew-recom manually with scripts/homebrew-formula.sh"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/chaseungjoon/homebrew-recom.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "${TAG#v}" checksums.txt > tap/Formula/recom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/recom.rb
          git commit -m "recom ${TAG#v}" && git push || echo "formula unchanged"
